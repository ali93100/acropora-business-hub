<!-- ============ EN-TÊTE ============ -->
<header class="topbar" id="top">
  <div class="container topbar__inner">
    <a class="topbar__logo" href="#top" aria-label="Acropora Data">
      <img src="assets/img/logo-white-coral.png" alt="Acropora Data" class="logo-on-dark" width="200" height="43">
      <img src="assets/img/logo-teal.png" alt="Acropora Data" class="logo-on-light" width="200" height="43">
    </a>
    <nav class="topbar__nav" id="site-nav" aria-label="Navigation principale">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#expertise" data-i18n="nav.expertise"></a>
      <a href="#services" data-i18n="nav.services"></a>
      <a href="#approach" data-i18n="nav.approach"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="topbar__actions">
      <a class="btn btn--coral btn--sm topbar__book" data-href="booking" target="_blank" rel="noopener"><svg class="ico"><use href="#i-calendar"/></svg><span data-i18n="nav.book"></span></a>
      <div class="lang-switch" role="group" aria-label="Langue / Language" id="lang-switch"></div>
      <button class="burger" id="burger" aria-controls="site-nav" aria-expanded="false">
        <span></span><span></span><span class="sr-only" data-i18n="nav.menu"></span>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <!-- ============ 1. HERO ============ -->
  <section class="hero" aria-labelledby="hero-name">
    <div class="hero__waves" aria-hidden="true"></div>
    <div class="hero__ring" aria-hidden="true"></div>
    <div class="container hero__grid">
      <div class="hero__text">
        <p class="eyebrow eyebrow--coral"><span class="eyebrow__bar"></span><span data-i18n="hero.eyebrow"></span></p>
        <p class="hero__company">ACROPORA DATA</p>
        <h1 class="hero__name" id="hero-name">Shaheen Alladin</h1>
        <p class="hero__role" data-i18n="hero.role"></p>
        <blockquote class="hero__quote"><p data-i18n="hero.quote"></p></blockquote>
        <p class="hero__intro" data-i18n="hero.intro"></p>
        <div class="hero__ctas">
          <a class="btn btn--coral" href="#expertise"><span data-i18n="hero.ctaExpertise"></span><svg class="ico"><use href="#i-arrow"/></svg></a>
          <a class="btn btn--light" href="#contact" data-i18n="hero.ctaContact"></a>
          <a class="btn btn--ghost" data-href="linkedin" target="_blank" rel="noopener"><svg class="ico"><use href="#i-linkedin"/></svg><span data-i18n="hero.ctaLinkedin"></span></a>
        </div>
      </div>
      <div class="hero__visual">
        <figure class="portrait">
          <div class="portrait__frame">
            <img class="portrait__img" id="portrait-img" alt="" data-i18n-alt="hero.photoAlt">
            <div class="portrait__fallback" aria-hidden="true">SA</div>
          </div>
          <figcaption class="portrait__tag">
            <strong>Shaheen Alladin</strong>
            <span data-i18n="hero.role"></span>
          </figcaption>
        </figure>
      </div>
    </div>

    <!-- Bandeau événement (masqué automatiquement après la date) -->
    <div class="container">
      <a class="event-strip" id="event-strip" data-href="booking" target="_blank" rel="noopener" hidden>
        <span class="event-strip__live"><span class="dot"></span><span data-i18n="event.label"></span></span>
        <span class="event-strip__text" data-i18n="event.text"></span>
        <span class="event-strip__cta"><span data-i18n="event.cta"></span><svg class="ico"><use href="#i-arrow"/></svg></span>
      </a>
    </div>
  </section>

  <!-- ============ 2. À PROPOS ============ -->
  <section class="section section--light" id="about" aria-labelledby="about-title">
    <div class="container about">
      <div class="about__main">
        <p class="eyebrow"><span class="eyebrow__bar"></span><span data-i18n="about.kicker"></span></p>
        <h2 class="h2" id="about-title" data-i18n="about.title"></h2>
        <div class="about__text" data-render="about-paragraphs"></div>
        <a class="link-arrow" data-href="website" target="_blank" rel="noopener"><span data-i18n="about.websiteCta"></span><svg class="ico"><use href="#i-arrow"/></svg></a>
      </div>
      <aside class="about__pillars">
        <p class="pillars__title" data-i18n="about.pillarsTitle"></p>
        <ol class="pillars" data-render="about-pillars"></ol>
      </aside>
    </div>
  </section>

  <!-- ============ 3. EXPERTISES ============ -->
  <section class="section" id="expertise" aria-labelledby="expertise-title">
    <div class="container">
      <header class="section__head">
        <p class="eyebrow"><span class="eyebrow__bar"></span><span data-i18n="expertise.kicker"></span></p>
        <h2 class="h2" id="expertise-title" data-i18n="expertise.title"></h2>
        <p class="lead" data-i18n="expertise.lead"></p>
      </header>
      <div class="cards" data-render="expertise"></div>
    </div>
  </section>

  <!-- ============ 4. SERVICES ============ -->
  <section class="section section--light" id="services" aria-labelledby="services-title">
    <div class="container">
      <header class="section__head">
        <p class="eyebrow"><span class="eyebrow__bar"></span><span data-i18n="services.kicker"></span></p>
        <h2 class="h2" id="services-title" data-i18n="services.title"></h2>
        <p class="lead" data-i18n="services.lead"></p>
      </header>
      <div class="services" data-render="services"></div>
    </div>
  </section>

  <!-- ============ 5. APPROCHE ============ -->
  <section class="section" id="approach" aria-labelledby="approach-title">
    <div class="container">
      <header class="section__head">
        <p class="eyebrow"><span class="eyebrow__bar"></span><span data-i18n="approach.kicker"></span></p>
        <h2 class="h2" id="approach-title" data-i18n="approach.title"></h2>
        <p class="lead" data-i18n="approach.lead"></p>
      </header>
      <ol class="steps" data-render="steps"></ol>
    </div>
  </section>

  <!-- ============ 6. INDICATEURS ============ -->
  <section class="figures" aria-labelledby="figures-title">
    <div class="figures__waves" aria-hidden="true"></div>
    <div class="container">
      <header class="section__head section__head--dark">
        <p class="eyebrow eyebrow--coral"><span class="eyebrow__bar"></span><span data-i18n="figures.kicker"></span></p>
        <h2 class="h2" id="figures-title" data-i18n="figures.title"></h2>
      </header>
      <ul class="figures__grid" data-render="figures"></ul>
    </div>
  </section>

  <!-- ============ 7. ÎLE MAURICE ============ -->
  <section class="section section--light" aria-labelledby="mu-title">
    <div class="container mu">
      <div class="mu__map">
        <img src="assets/img/mauritius.png" alt="" data-i18n-alt="mauritius.mapAlt" width="446" height="520">
      </div>
      <div class="mu__text">
        <p class="eyebrow"><span class="eyebrow__bar"></span><span data-i18n="mauritius.kicker"></span></p>
        <h2 class="h2" id="mu-title" data-i18n="mauritius.title"></h2>
        <p class="lead" data-i18n="mauritius.lead"></p>
        <ul class="mu__list" data-render="mauritius"></ul>
      </div>
    </div>
  </section>

  <!-- ============ 8. CONTACT ============ -->
  <section class="section contact-section" id="contact" aria-labelledby="contact-title">
    <div class="container">
      <header class="section__head">
        <p class="eyebrow"><span class="eyebrow__bar"></span><span data-i18n="contact.kicker"></span></p>
        <h2 class="h2" id="contact-title" data-i18n="contact.title"></h2>
        <p class="lead" data-i18n="contact.lead"></p>
      </header>

      <!-- Réservation d'un créneau (Microsoft Bookings) -->
      <a class="booking" data-href="booking" target="_blank" rel="noopener">
        <span class="booking__icon"><svg class="ico"><use href="#i-calendar"/></svg></span>
        <span class="booking__body">
          <span class="booking__badge"><svg class="ico"><use href="#i-teams"/></svg><span data-i18n="contact.booking.badge"></span></span>
          <strong class="booking__title" data-i18n="contact.booking.title"></strong>
          <span class="booking__text" data-i18n="contact.booking.text"></span>
        </span>
        <span class="btn btn--coral booking__cta"><span data-i18n="contact.booking.cta"></span><svg class="ico"><use href="#i-arrow"/></svg></span>
      </a>

      <div class="contact">
        <!-- Carte de visite -->
        <div class="bizcard">
          <div class="bizcard__head">
            <div class="bizcard__avatar">
              <img id="avatar-img" alt="">
              <span aria-hidden="true">SA</span>
            </div>
            <div>
              <p class="bizcard__name">Shaheen Alladin</p>
              <p class="bizcard__role" data-i18n="hero.role"></p>
              <img class="bizcard__logo" src="assets/img/logo-white-coral.png" alt="Acropora Data" width="150" height="32">
            </div>
          </div>
          <ul class="bizcard__list">
            <li><a data-href="booking" target="_blank" rel="noopener"><svg class="ico ico--accent"><use href="#i-calendar"/></svg><span><strong data-i18n="contact.actions.book"></strong><small data-i18n="contact.actions.bookHint"></small></span></a></li>
            <li><a data-href="email"><svg class="ico"><use href="#i-mail"/></svg><span><strong data-i18n="contact.actions.email"></strong><small data-text="email"></small></span></a></li>
            <li><a data-href="whatsapp" target="_blank" rel="noopener"><svg class="ico"><use href="#i-whatsapp"/></svg><span><strong data-i18n="contact.actions.whatsapp"></strong><small data-text="phoneDisplay"></small></span></a></li>
            <li><a data-href="linkedin" target="_blank" rel="noopener"><svg class="ico"><use href="#i-linkedin"/></svg><span><strong data-i18n="contact.actions.linkedin"></strong><small>linkedin.com/in/shaheen-alladin</small></span></a></li>
            <li><a data-href="website" target="_blank" rel="noopener"><svg class="ico"><use href="#i-globe"/></svg><span><strong data-i18n="contact.actions.website"></strong><small data-text="websiteLabel"></small></span></a></li>
          </ul>
          <div class="bizcard__primary">
            <a class="btn btn--coral btn--block" data-href="vcard" download="Shaheen-Alladin_Acropora-Data.vcf"><svg class="ico"><use href="#i-vcard"/></svg><span data-i18n="contact.actions.vcard"></span></a>
            <a class="btn btn--light btn--block" data-href="presentation" download><svg class="ico"><use href="#i-download"/></svg><span data-i18n="contact.actions.deck"></span></a>
          </div>
        </div>

        <!-- Formulaire -->
        <form class="form" id="contact-form" novalidate>
          <h3 class="form__title" data-i18n="contact.form.title"></h3>
          <div class="form__row">
            <label class="field"><span data-i18n="contact.form.name"></span><input type="text" name="name" autocomplete="name" required></label>
            <label class="field"><span data-i18n="contact.form.company"></span><input type="text" name="company" autocomplete="organization"></label>
          </div>
          <div class="form__row">
            <label class="field"><span data-i18n="contact.form.email"></span><input type="email" name="email" autocomplete="email" required></label>
            <label class="field"><span data-i18n="contact.form.topic"></span><select name="topic" data-render="topics"></select></label>
          </div>
          <label class="field"><span data-i18n="contact.form.message"></span><textarea name="message" rows="5" required data-i18n-placeholder="contact.form.messagePlaceholder"></textarea></label>
          <label class="check"><input type="checkbox" name="consent" required><span data-i18n="contact.form.consent"></span></label>
          <p class="form__msg" id="form-msg" role="status" aria-live="polite"></p>
          <div class="form__actions">
            <button type="submit" class="btn btn--teal" value="email"><svg class="ico"><use href="#i-mail"/></svg><span data-i18n="contact.form.sendEmail"></span></button>
            <button type="submit" class="btn btn--outline" value="whatsapp"><svg class="ico"><use href="#i-whatsapp"/></svg><span data-i18n="contact.form.sendWhatsapp"></span></button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<!-- ============ PIED DE PAGE ============ -->
<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__brand">
      <img src="assets/img/logo-white-coral.png" alt="Acropora Data" width="170" height="37">
      <p data-i18n="footer.tagline"></p>
    </div>
    <ul class="footer__links">
      <li><a data-href="website" target="_blank" rel="noopener" data-text="websiteLabel"></a></li>
      <li><a data-href="linkedin" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a data-href="email" data-text="email"></a></li>
    </ul>
    <div class="footer__bottom">
      <p>© <span id="year">2026</span> Acropora Data Ltd. <span data-i18n="footer.rights"></span></p>
      <a href="#top" class="footer__top"><span data-i18n="footer.backToTop"></span><svg class="ico"><use href="#i-up"/></svg></a>
    </div>
  </div>
</footer>

<nav class="quickbar" aria-label="Contact rapide">
  <a data-href="email" aria-label="E-mail"><svg class="ico"><use href="#i-mail"/></svg></a>
  <a data-href="whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp"><svg class="ico"><use href="#i-whatsapp"/></svg></a>

  <a class="quickbar__main" data-href="vcard" download="Shaheen-Alladin_Acropora-Data.vcf"><svg class="ico"><use href="#i-vcard"/></svg><span data-i18n="contact.actions.vcardShort"></span></a>
</nav>
